<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b578b">
  <title>Veículo encontrado</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b578b;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }
    .tela {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b578b;
    }
    .tela img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 768px;
      max-height: 100svh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="tela" aria-label="Identificação do veículo">
    <img src="veiculo.png"
         alt="Veículo encontrado. Placa QQX2F40, modelo Volkswagen T-Cross, cor preta.">
  </main>
</body>
</html>
